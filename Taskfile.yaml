version: "3"

tasks:
  default:
    cmds:
      - task: fmt
      - task: check
      - task: test
  fmt:
    cmds:
      - go tool golangci-lint fmt
      - go mod tidy
  check:
    cmds:
      - go vet -all ./...
      - go tool golangci-lint run
  test:
    cmds:
      - go test -race ./...
  install:
    desc: install a release-sized ytea (no debug info or symbol table)
    cmds:
      - go install -trimpath -ldflags="-s -w" ./cmd/ytea
